plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'br.com.forza'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

tasks.named('test') {
    useJUnitPlatform()
}

// Contrato de API (OpenAPI) versionado no repositório — fonte da verdade para qualquer
// client (frontend, agentes de IA). Gerado sem depender de Postgres nem de rede: Liquibase
// desligado e pool Hikari sem conexão inicial (initialization-fail-timeout=-1; o
// JdbcTemplate só precisa existir pra montar os beans), listener UDP desligado. Porta 7099
// pra não disputar a 7057 com o container local.
openApi {
    apiDocsUrl.set("http://localhost:7099/v3/api-docs.yaml")
    outputDir.set(file("$rootDir/openapi"))
    outputFileName.set("openapi.yaml")
    waitTimeInSeconds.set(60)
    customBootRun {
        args.set([
                "--spring.profiles.active=dev",
                "--server.port=7099",
                "--telemetry.udp.enabled=false",
                "--spring.liquibase.enabled=false",
                "--spring.datasource.url=jdbc:postgresql://localhost:1/sem-banco",
                "--spring.datasource.hikari.initialization-fail-timeout=-1"
        ])
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
