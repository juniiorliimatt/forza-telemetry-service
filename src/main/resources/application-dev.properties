spring.main.banner-mode=console
spring.output.ansi.enabled=always

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:7050/workbox?reWriteBatchedInserts=true}
spring.datasource.username=${POSTGRES_USER:forza_service}
spring.datasource.password=${POSTGRES_PASSWORD:forza_service}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.drop-first=false
spring.liquibase.default-schema=forza

debug=false
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%-5p) %clr([env:${spring.profiles.active}]){green} %clr(${PID}){faint} %clr([%thread]){cyan} %clr(%logger{36}){yellow} %clr(:){red} %clr(%m){faint}%n
