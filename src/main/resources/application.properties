spring.application.name=forza-telemetry-service
spring.profiles.active=${PROFILE_ACTIVE:dev}
spring.threads.virtual.enabled=true
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog.yaml
server.port=${PORT:7057}
springdoc.writer-with-order-by-keys=true

# --- Pipeline de telemetria (Forza Data Out) ---
# Porta UDP em que o jogo envia os pacotes (Xbox -> IP deste host). Evite 5200-5300: o
# Forza Horizon usa essa faixa pros próprios sockets de saída.
telemetry.udp.enabled=${TELEMETRY_UDP_ENABLED:true}
telemetry.udp.port=${TELEMETRY_UDP_PORT:5310}
# Onde o jogo deve apontar (exibido na tela "Ao vivo"). De dentro do container o serviço só
# vê o IP da rede docker, então o IP da máquina na LAN vem por configuração (lista separada
# por vírgula; vazio = não anunciado). A porta anunciada é a PUBLICADA no host.
telemetry.advertised-hosts=${TELEMETRY_ADVERTISED_HOST:}
telemetry.advertised-port=${TELEMETRY_ADVERTISED_PORT:${telemetry.udp.port}}
# Recomendação de tuning: mínimo de sessões E de amostras e janela das sessões mais recentes consideradas (setups
# antigos saem da janela). 50000 amostras = 10 sessões cheias de telemetry.session-max-samples (5000 cada). Só amostras e
# sessões contam — tempo não entra na regra.
tuning.min-sessions=10
tuning.min-samples=50000
tuning.max-sessions=20
# Tamanho de uma sessão cheia (mostrado como alvo da sessão em andamento): é o mesmo limite da rotação de sessões.
tuning.session-samples=${telemetry.session-max-samples}
# Ao reiniciar a coleta de um carro/classe, as amostras brutas (forza.samples) das sessões dele são apagadas, menos as N
# mais recentes (telemetria de amostra). Resumo, voltas e histórico de tuning ficam. Sem retenção por tempo.
tuning.keep-sample-sessions=2
telemetry.udp.queue-capacity=4096
telemetry.udp.receive-buffer-bytes=1048576
# O jogo manda ~60 pacotes/s; persiste 1 a cada N (3 => ~20 Hz).
telemetry.sample-every=3
# Não há regra de tempo para fechar sessão (pausa, garagem, sair do jogo e voltar só amanhã continuam na mesma sessão).
# O jogo não avisa quando o carro está na garagem (manda IsRaceOn=1 com o carro parado): só as amostras limitam a
# sessão. Carro parado (< 0.5 m/s) não gera amostra nem abre sessão; a sessão fecha sozinha ao juntar esse tanto de
# amostras gravadas e a próxima abre na sequência. Em corrida/evento (lapNumber > 0) espera o fim para fechar.
telemetry.session-max-samples=5000
telemetry.flush-interval=1s
telemetry.flush-batch-size=200
# Sessões com menos amostras que isso (~5 s a 20 Hz) são descartadas (ruído de menu).
telemetry.min-session-samples=100
telemetry.live-stale-after=5s

introspection.uri=${INTROSPECTION_URI:http://localhost:7051/api/v1/auth/introspect}
introspection.client-id=${INTROSPECTION_CLIENT_ID:forza-telemetry-service}
introspection.client-secret=${INTROSPECTION_CLIENT_SECRET:MyS3cur3Cli3ntS3cr3t!F0rza!}
